[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pangolin"
version = "0.1.0"
description = "A lightweight framework for agent runtimes and memory management."
readme = "README.md"
requires-python = ">=3.14"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    "dataclasses-json"
]

[project.optional-dependencies]
openai = ["openai>=2.49.0"]
anthropic = ["anthropic>=2.9.0"]
gemini = ["google-genai>=3.3.0"]
requests = ["requests>=2.34.2"]
beautifulsoup4 = ["beautifulsoup4>=4.15.0"]
ddgs = ["ddgs>=9.16.0"]
all = [
    "pangolin[openai]",
    "pangolin[anthropic]",
    "pangolin[gemini]",
    "pangolin[requests]",
    "pangolin[beautifulsoup4]",
    "pangolin[ddgs]"
]

[tool.setuptools.packages.find]
include = ["pangolin*"]
exclude = ["examples*", "tests*"]