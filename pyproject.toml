[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pangolin-agent"
version = "0.1.3b1"
description = "A lightweight, modular, interface based AI Agentic library."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "PolyForm Noncommercial 1.0.0"}
license-files = ["LICENSE*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

dependencies = [
    "dataclasses-json>=0.6.0",
]


[project.urls]
Homepage = "https://github.com/NerdCult/pangolin"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-genai>=3.6.0"]
tools = ["beautifulsoup4>=4.12.0", "ddgs>=9.0.0", "requests>=2.32.0"]
rag = ["fastembed>=0.9.0", "chromadb>=1.5.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-genai>=3.6.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "requests>=2.32.0",
    "fastembed>=0.9.0",
    "chromadb>=1.5.0"
]

[tool.hatch.build.targets.wheel]
packages = ["pangolin_agent"]
include = [
    "pangolin_agent",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.sdist]
include = ["pangolin_agent", "README.md", "LICENSE"]
